<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="四個面向的職涯探索測驗：興趣、個性、天賦、價值觀。約 12 分鐘，結果只留在你的瀏覽器。">
<title>天賦羅盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap">
<style id="app-css">
/* Layout: one reading column (48rem). The quiz shows one card at a time; the report is a long column opened by the archetype and the Holland hexagon. */
:root{
  --paper:#F4F5F9;--surface:#FFFFFF;--sunk:#E8EBF3;--line:#D6DAE7;
  --ink:#192140;--ink-2:#454F70;--ink-3:#6E7692;
  --needle:#C63F2A;--needle-soft:#F7E0DA;
  --navy:#26357A;--navy-soft:#E1E5F5;
  --t-R:#8A6814;--t-I:#2B68AE;--t-A:#A13A8B;--t-S:#1F7F63;--t-E:#C4561F;--t-C:#5357A6;
  --f-display:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","STKaiti",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-num:"Space Grotesk","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1322;--surface:#171C30;--sunk:#222842;--line:#2F3655;
  --ink:#E9ECF6;--ink-2:#B6BCD2;--ink-3:#8A91AC;
  --needle:#FF7A63;--needle-soft:#3C2326;
  --navy:#AAB8FF;--navy-soft:#262F57;
  --t-R:#D9B35E;--t-I:#77AEF2;--t-A:#E087D0;--t-S:#62CDA5;--t-E:#F39463;--t-C:#A8ACF2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1322;--surface:#171C30;--sunk:#222842;--line:#2F3655;
  --ink:#E9ECF6;--ink-2:#B6BCD2;--ink-3:#8A91AC;
  --needle:#FF7A63;--needle-soft:#3C2326;
  --navy:#AAB8FF;--navy-soft:#262F57;
  --t-R:#D9B35E;--t-I:#77AEF2;--t-A:#E087D0;--t-S:#62CDA5;--t-E:#F39463;--t-C:#A8ACF2;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
.app{max-width:48rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 80px}
h1,h2,h3,h4,p{margin:0}
.display{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-wrap:balance}
.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--ink-3);font-weight:500}
.lede{font-size:18px;color:var(--ink-2);max-width:36em}
.note{font-size:13.5px;color:var(--ink-3);max-width:44em}
.prose-p{color:var(--ink-2);max-width:40em}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;cursor:pointer;font-weight:500;transition:transform .12s,background-color .15s}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line);color:var(--ink);background:var(--surface)}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.link{background:none;border:0;padding:8px 2px;color:var(--ink-2);cursor:pointer;font-size:15px}
.link:hover{color:var(--ink)}
:focus-visible{outline:2.5px solid var(--navy);outline-offset:3px;border-radius:8px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px;font-weight:700;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.mark{width:30px;height:30px;color:var(--ink);flex:none}
.mark .needle{transform-box:view-box;transform-origin:16px 16px;transition:transform 1s cubic-bezier(.3,1.5,.5,1)}
.tb-progress{font-family:var(--f-num);font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pbar{height:3px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-bottom:26px}
.pbar span{display:block;height:100%;width:0;background:var(--needle);transition:width .3s}

/* intro */
.intro{display:grid;gap:26px;padding-top:22px}
.intro h1{font-size:clamp(46px,10vw,68px);line-height:1.1}
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.parts li{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);min-width:0}
.pn{font-family:var(--f-num);font-weight:700;font-size:15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy);flex:none}
.parts b{display:block;font-size:17px}
.parts div span{display:block;color:var(--ink-2);font-size:15px}
.parts small{display:block;color:var(--ink-3);font-size:13px}
.toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer;max-width:38em}
.toggle input{width:20px;height:20px;margin:4px 0 0;accent-color:var(--navy);flex:none}
.toggle small{display:block;color:var(--ink-3);font-size:13.5px}
.preview{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:20px;align-items:center;padding:20px 22px;border-radius:var(--radius);background:var(--sunk)}
.getlist{margin:8px 0 0;padding-left:1.2em;color:var(--ink-2)}
.mini-hex{margin:0;text-align:center}
.mini-hex svg{width:100%;height:auto;display:block}
.mini-hex figcaption{font-size:12px;color:var(--ink-3)}
@media (max-width:560px){.parts{grid-template-columns:minmax(0,1fr)}.preview{grid-template-columns:minmax(0,1fr)}.mini-hex{max-width:200px;margin-inline:auto}}

/* quiz */
.sec-intro{display:grid;gap:18px;padding-top:28px;max-width:36em}
.sec-intro h2{font-size:clamp(38px,8vw,52px);line-height:1.15}
.sec-intro h2 span{display:block;font-family:var(--f-body);font-weight:400;font-size:18px;color:var(--ink-2);letter-spacing:0;margin-top:8px}
.sec-intro .body{font-size:17px;color:var(--ink-2)}
.qwrap{display:grid;gap:14px}
.qmeta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--ink-3)}
.sec-tag{font-weight:500;color:var(--ink-2)}
.count{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,36px);display:grid;gap:14px}
.qprompt{font-size:14px;color:var(--ink-3)}
.qtext{font-family:var(--f-display);font-size:clamp(25px,5.6vw,33px);line-height:1.4;min-height:2.8em;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px}
.opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;transition:border-color .12s,background-color .12s}
.opt .k{font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--ink-3)}
.opt .l{font-size:14px;color:var(--ink-2);line-height:1.35;text-align:center}
.opt:hover{border-color:var(--ink-3)}
.opt.on{border-color:var(--navy);background:var(--navy-soft)}
.opt.on .k,.opt.on .l{color:var(--navy)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;min-height:46px}
.hint{font-size:13px;color:var(--ink-3)}
.notice{font-size:14.5px;color:var(--needle)}
@media (max-width:620px){.opts{grid-template-columns:minmax(0,1fr)}.opt{flex-direction:row;justify-content:flex-start;gap:14px;padding:11px 16px}.opt .l{text-align:left;font-size:16px}.hint{display:none}}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vcard{position:relative;text-align:left;display:grid;gap:2px;padding:14px 16px 14px 58px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;min-width:0}
.vcard b{font-size:17px}
.vcard .vd{font-size:14px;color:var(--ink-2);line-height:1.55}
.vr{position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:50%;border:1.5px dashed var(--ink-3);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:15px}
.vcard.on{border-color:var(--navy);background:var(--navy-soft)}
.vcard.on .vr{background:var(--navy);color:var(--surface);border-color:var(--navy);border-style:solid}
@media (max-width:560px){.vgrid{grid-template-columns:minmax(0,1fr)}}

/* report */
.report{display:grid;gap:54px;padding-top:18px}
.r-hero{display:grid;gap:16px}
.arche{font-size:clamp(38px,8.5vw,58px);line-height:1.15}
.arche::after{content:"";display:block;width:64px;height:4px;border-radius:2px;background:var(--needle);margin-top:16px}
.keyfacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin:6px 0 0}
.keyfacts div{background:var(--surface);padding:14px 16px;min-width:0}
.keyfacts dt{font-size:12.5px;color:var(--ink-3);letter-spacing:.06em}
.keyfacts dd{margin:4px 0 0;font-weight:700;font-size:16px;line-height:1.45}
.keyfacts dd.code{display:flex;gap:6px;font-family:var(--f-num);font-size:28px;line-height:1.1}
.code span,.mini-code span{color:var(--tc)}
@media (max-width:640px){.keyfacts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.r-sec{display:grid;gap:18px}
.sec-head{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:22px}
.sec-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5.2vw,32px);line-height:1.3;text-wrap:balance}
.sub{font-size:17px;margin-top:6px}
.prose{display:grid;gap:12px;max-width:40em;color:var(--ink-2)}
.prose b{color:var(--ink)}
.interest{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.hex{margin:0}
.hex svg{width:100%;height:auto;display:block;max-width:420px;margin-inline:auto}
.hx-ring{fill:none;stroke:var(--line);stroke-width:1}
.hx-axis{stroke:var(--line);stroke-width:1}
.hx-shape{fill:var(--needle);fill-opacity:.14;stroke:var(--needle);stroke-width:2;stroke-linejoin:round}
.hx-l{font-family:var(--f-body);font-size:13px;font-weight:500;fill:var(--ink-2)}
.hx-letter{font-family:var(--f-num);font-weight:700;font-size:15px}
.hx-v{font-family:var(--f-num);font-weight:700;font-size:13px;fill:var(--ink)}
svg.mini .hx-letter{font-size:28px}
@media (max-width:640px){.interest{grid-template-columns:minmax(0,1fr)}}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:7.2em minmax(0,1fr) 2.6em;gap:12px;align-items:center;font-size:15px}
.bar-row .bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bl b{font-family:var(--f-num);color:var(--tc,var(--navy));margin-right:4px}
.bv{font-family:var(--f-num);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.track{position:relative;display:block;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--tc,var(--navy))}
.t-grid{display:grid;gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:10px}
.tcard header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.t-no{font-family:var(--f-num);font-weight:700;color:var(--needle);font-size:15px}
.tcard h3{font-family:var(--f-display);font-size:26px;font-weight:700}
.tcard .score{font-family:var(--f-num);font-weight:700;color:var(--ink-3);font-size:14px;margin-left:auto}
.tcard .one{font-size:17px}
.tcard dl{display:grid;grid-template-columns:5em minmax(0,1fr);gap:6px 12px;margin:0;font-size:15px}
.tcard dt{color:var(--ink-3)}
.tcard dd{margin:0;color:var(--ink-2)}
.evid{background:var(--needle-soft);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--ink)}
.evid .who{display:block;font-size:12.5px;color:var(--needle);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.t-support{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ts{display:flex;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;min-width:0}
.ts .t-no{color:var(--navy)}
.ts b{display:block;font-size:17px}
.ts span.tx{display:block;color:var(--ink-2);font-size:14.5px}
@media (max-width:560px){.t-support{grid-template-columns:minmax(0,1fr)}}
.callout{border:1.5px dashed var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:8px;color:var(--ink-2)}
.callout b{color:var(--ink)}
.callout ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.b5{display:grid;gap:20px}
.b5-row{display:grid;gap:6px}
.b5-top{display:flex;align-items:baseline;gap:10px}
.b5-top b{font-size:17px}
.b5-top .bv{margin-left:auto}
.band{font-size:12.5px;padding:1px 10px;border-radius:99px;background:var(--sunk);color:var(--ink-2)}
.band.hi{background:var(--navy-soft);color:var(--navy)}
.band.lo{background:transparent;border:1px solid var(--line)}
.scale .mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--surface)}
.b5-row p{color:var(--ink-2);font-size:15px}
.vlist{list-style:none;margin:0;padding:0;display:grid}
.vlist li{display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.vlist .vn{font-family:var(--f-num);font-weight:700;font-size:22px;line-height:1.3;color:var(--ink-3)}
.vlist li:nth-child(-n+2) .vn{color:var(--needle)}
.vlist b{font-size:17px}
.vlist p{color:var(--ink-2);font-size:15px}
.vlist .ask{color:var(--ink);margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:12px;align-content:start;min-width:0}
.c-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline}
.c-rank{font-family:var(--f-num);font-weight:700;color:var(--ink-3);font-size:15px}
.c-head h3{font-size:18px;line-height:1.4}
.c-score{font-family:var(--f-num);font-weight:700;font-size:26px;color:var(--needle);line-height:1;font-variant-numeric:tabular-nums}
.c-score small{font-size:14px;margin-left:1px}
.c-desc{color:var(--ink-2);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:3px 10px;border-radius:99px;background:var(--navy-soft);color:var(--navy);line-height:1.5}
.c-meta{display:grid;gap:8px;margin:0;font-size:14.5px}
.c-meta div{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:10px}
.c-meta dt{color:var(--ink-3)}
.c-meta dd{margin:0;color:var(--ink-2)}
.c-meta .mine dd{color:var(--ink)}
.mini-code{font-family:var(--f-num);font-weight:700;letter-spacing:.08em}
.c-split{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:10px}
.c-split .track{height:6px;margin-top:4px}
.more{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.more li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;min-width:0}
.more .s{font-family:var(--f-num);font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
@media (max-width:640px){.cgrid,.more{grid-template-columns:minmax(0,1fr)}}
.plan{list-style:none;margin:0;padding:0;display:grid}
.plan>li{display:grid;grid-template-columns:8em minmax(0,1fr);gap:16px;padding:18px 0;border-top:1px solid var(--line)}
.plan .ph{font-family:var(--f-num);font-weight:700;color:var(--needle);font-size:14px}
.plan .ph b{display:block;font-family:var(--f-display);font-size:23px;color:var(--ink);font-weight:700;line-height:1.35}
.plan ul{margin:0;padding-left:1.1em;display:grid;gap:6px;color:var(--ink-2)}
@media (max-width:560px){.plan>li{grid-template-columns:minmax(0,1fr);gap:8px}}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(20px,5vw,32px);display:grid;gap:12px;font-size:16.5px}
.letter:empty{display:none}
.letter h4{font-family:var(--f-display);font-size:22px;margin-top:6px}
.letter p,.letter li{color:var(--ink-2)}
.letter strong{color:var(--ink)}
.letter ul,.letter ol{margin:0;padding-left:1.3em;display:grid;gap:6px}
.thinking{color:var(--ink-3);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.about{margin:0;padding-left:1.2em;display:grid;gap:8px;color:var(--ink-2);font-size:15px;max-width:44em}
.about b{color:var(--ink)}
.r-actions{display:grid;gap:14px;border-top:1px solid var(--line);padding-top:22px}
.save-status{font-size:15px;color:var(--ink-2)}
.save-status[data-s="saved"]{color:var(--t-S)}
.save-status[data-s="error"],.save-status[data-s="denied"]{color:var(--needle)}
#copy-fallback{width:100%;min-height:180px;font:14px/1.6 var(--f-body);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{.no-export,.topbar,.pbar{display:none!important}.report{gap:28px}.ccard,.tcard,.callout,.plan>li{break-inside:avoid}}
</style>
</head>
<body>


<div class="app">
  <header class="topbar">
    <button class="brand" data-act="home" aria-label="回到天賦羅盤首頁">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.6"/><g class="needle"><path d="M16 4.5 L19.6 16 L12.4 16 Z" fill="var(--needle)"/><path d="M16 27.5 L12.4 16 L19.6 16 Z" fill="currentColor" opacity=".5"/></g><circle cx="16" cy="16" r="1.9" fill="var(--paper)" stroke="currentColor" stroke-width="1"/></svg>
      <span>天賦羅盤</span>
    </button>
    <span class="tb-progress" id="tb-progress"></span>
  </header>
  <div class="pbar" id="pbar" hidden><span id="pbar-fill"></span></div>
  <main id="view"></main>
  <noscript><p>這份測驗需要開啟 JavaScript 才能使用。</p></noscript>
</div>

<script>
(function () {
'use strict';
document.documentElement.lang = 'zh-Hant';
var $ = function (s, r) { return (r || document).querySelector(s); };
var FONT_URL = 'https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap';
var KEY = 'talent-compass:v1';

/* ================= content ================= */

function reasons(c, R) {
  var out = [], top3 = R.order.slice(0, 3), myT = R.tRank.slice(0, 5), myV = R.vals.slice(0, 2);
  var sl = c.code.split('').filter(function (L) { return top3.indexOf(L) >= 0; });
  if (sl.length) out.push('興趣重疊：' + sl.map(function (L) { return L + ' ' + RIASEC[L].name; }).join('、'));
  var st = c.talents.filter(function (k) { return myT.indexOf(k) >= 0; });
  if (st.length) out.push('用得到你的' + st.map(tn).join('、'));
  var sv = c.values.filter(function (k) { return myV.indexOf(k) >= 0; });
  if (sv.length) out.push('滿足你在乎的' + sv.map(function (k) { return VALUES[k].name; }).join('、'));
  return out;
}

/* ================= render & navigation ================= */
var lastKey = '';
function render() {
  var view = $('#view'), html, key;
  if (state.screen === 'results' && state.doneAt) { html = viewResults(); key = 'results'; }
  else if (state.screen === 'quiz') {
    var st = STEPS[state.idx]; key = 'q' + state.idx;
    html = st.type === 'section' ? viewSection(st) : (st.type === 'q' ? viewQuestion(st) : viewValues());
  } else { state.screen = 'intro'; html = viewIntro(); key = 'intro'; }
  view.innerHTML = html;
  updateTopbar();
  if (key !== lastKey) { window.scrollTo(0, 0); lastKey = key; }
  var f = view.querySelector('[data-focus]');
  if (f) { try { f.focus({ preventScroll: true }); } catch (e) { f.focus(); } }
  if (state.screen === 'results') afterResults();
}
function updateTopbar() {
  var pb = $('#pbar'), fill = $('#pbar-fill'), tp = $('#tb-progress'), n = countAnswered();
  if (state.screen === 'quiz') { pb.hidden = false; fill.style.width = (n / TOTAL_Q * 100).toFixed(1) + '%'; tp.textContent = n + ' / ' + TOTAL_Q; }

}
var lock = false;
var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function answer(v) {
  var st = STEPS[state.idx];
  if (state.screen !== 'quiz' || !st || st.type !== 'q' || lock) return;
  state.ans[st.id] = v; persist();
  Array.prototype.forEach.call(document.querySelectorAll('.opt'), function (b) { var on = +b.dataset.val === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  updateTopbar();
  lock = true;
  setTimeout(function () { lock = false; if (STEPS[state.idx] === st && state.screen === 'quiz') next(); }, reduceMotion ? 60 : 180);
}
function next() { if (state.idx < STEPS.length - 1) { state.idx++; persist(); render(); } }
function back() {
  if (state.screen !== 'quiz') return;

}
function toggleValue(k) {

  if (i >= 0) state.values = state.values.slice(0, i); else state.values.push(k);

}
function finish() {
  var miss = -1;
  for (var i = 0; i < STEPS.length; i++) { if (STEPS[i].type === 'q' && !state.ans[STEPS[i].id]) { miss = i; break; } }
  if (miss >= 0) { state.idx = miss; notice = '還有題目沒作答，先完成這一題，再回到價值觀排序。'; persist(); render(); return; }
  if (state.values.length < 6) return;
  state.doneAt = new Date().toISOString(); state.savedFor = null; state.letter = null; state.screen = 'results';
  persist(); render();
}
var armTimer = null;
function restart(btn) {
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1'; btn.dataset.label = btn.textContent; btn.textContent = '再按一次，清除目前的作答';
    clearTimeout(armTimer);
    armTimer = setTimeout(function () { btn.dataset.armed = ''; btn.textContent = btn.dataset.label; }, 4000);
    return;
  }
  clearTimeout(armTimer);
  state = freshState(state.observe); state.screen = 'quiz'; RES = null;
  persist(); render();
}

/* ================= results: save, copy, download, letter ================= */
var isOwnerCache = false, resToken = 0, saving = false;
function setSave(s, owner) {
  var el = $('#save-status'), btn = $('#btn-save');
  if (!el) return;
  var M = {
    connecting: '正在確認儲存功能…',
    saving: '正在儲存結果…',
    saved: owner ? '結果已儲存。回到對話跟 Claude 說「我做完了」，它就能讀到你的完整結果。' : '結果已儲存。這份測驗的擁有者（和協助他的 Claude）看得到你的結果。',
    offer: '想讓 Claude 讀到結果，請按「儲存結果」。儲存後，這份測驗的擁有者（和協助他的 Claude）看得到你的結果。',
    unavailable: '結果只存在這個瀏覽器，不會傳給任何人。想請別人幫你看，可以按「複製結果摘要」或「下載報告」，再自己傳給對方。',
    denied: '你在這裡沒有儲存的權限。可以按「複製結果摘要」，貼給 Claude。',
    error: '儲存失敗了。請再按一次「儲存結果」，或改用「複製結果摘要」。'
  };
  el.dataset.s = s; el.textContent = M[s] || '';
  if (btn) btn.hidden = !(s === 'offer' || s === 'error');
}
function afterResults() {
  var tk = ++resToken;
  Promise.all([use('downloads'), use('sample'), use('db'), use('user')]).then(function (r) {
    if (tk !== resToken || state.screen !== 'results') return;
    var dl = r[0], sample = r[1], db = r[2], user = r[3];
    var bdl = $('#btn-dl'); if (bdl) bdl.hidden = !dl;
    var ai = $('#sec-ai'); if (ai) ai.hidden = !(sample || state.letter);
    var ctl = $('.ai-ctl'); if (ctl && !sample) ctl.hidden = true;
    if (!db || !user) { setSave('unavailable'); return; }
    Promise.resolve(user.isOwner()).then(function (owner) {
      if (tk !== resToken || state.screen !== 'results') return;
      isOwnerCache = !!owner;
      if (state.savedFor && state.savedFor === state.doneAt) { setSave('saved', isOwnerCache); return; }
      if (isOwnerCache) saveResult(); else setSave('offer');
    }, function () { setSave('offer'); });
  });
}
function round1(v) { return Math.round(v * 10) / 10; }
function buildPayload() {
  var R = RES || compute(), b5 = {}, tt = {};
  B5KEYS.forEach(function (k) { b5[k] = round1(R.b5[k]); });
  T_ORDER.forEach(function (k) { tt[k] = round1(R.t[k]); });
  return {
    version: 1, takenAt: state.doneAt, savedAt: new Date().toISOString(), observe: !!state.observe,
    archetype: archeOf(R), hollandCode: R.code, riasec: R.ri, bigFive: b5, talents: tt,
    talentRank: R.tRank, values: R.vals,
    topCareers: R.careers.slice(0, 8).map(function (c) { return { id: c.id, name: c.name, score: c.score }; }),
    answers: state.ans, letter: state.letter || null
  };
}
function saveResult() {
  if (saving) return; saving = true; setSave('saving');
  Promise.all([use('db'), use('user')]).then(function (r) {
    var db = r[0], user = r[1];
    if (!db || !user) { setSave('unavailable'); return null; }
    return Promise.resolve(user.id()).then(function (uid) {
      if (!uid) { setSave('unavailable'); return null; }
      var payload = buildPayload(), doneAt = state.doneAt;
      function write() { return db.doc('results/' + uid).set(payload); }
      return write().catch(function (e) {
        if (e && e.code === 'unavailable') return new Promise(function (res) { setTimeout(res, 600 + Math.random() * 600); }).then(write);
        throw e;
      }).then(function () {
        if (state.doneAt === doneAt) { state.savedFor = doneAt; persist(); }
        setSave('saved', isOwnerCache);
      });
    });
  }).catch(function (e) {
    var c = e && e.code;
    setSave((c === 'invalid_argument' || c === 'not_granted' || c === 'revoked') ? 'denied' : 'error');
  }).then(function () { saving = false; });
}
function saveLetter(text) {
  if (!state.savedFor || state.savedFor !== state.doneAt) return;
  Promise.all([use('db'), use('user')]).then(function (r) {
    if (!r[0] || !r[1]) return null;
    return Promise.resolve(r[1].id()).then(function (uid) { if (uid) return r[0].doc('results/' + uid).update({ letter: text }); return null; });
  }).catch(function () { /* the letter stays on the page even if this update fails */ });
}
function summaryText() {
  var R = RES || compute(), L = [];
  L.push('【天賦羅盤結果】' + fmtDate(state.doneAt));
  L.push('類型：' + archeOf(R));
  L.push('Holland 代碼：' + R.code + '（' + HEX.map(function (x) { return x + ' ' + R.ri[x]; }).join(' / ') + '）');
  L.push('天賦排序：' + R.tRank.map(function (k) { return tn(k) + ' ' + R.t[k].toFixed(1); }).join('、'));
  L.push('五大人格：' + B5KEYS.map(function (k) { return B5INFO[k].name + ' ' + R.b5[k].toFixed(1); }).join('、'));
  L.push('價值觀：' + R.vals.map(function (k) { return VALUES[k].name; }).join(' > '));
  L.push('最契合方向：' + R.careers.slice(0, 6).map(function (c, i) { return (i + 1) + '. ' + c.name + ' ' + c.score + '%'; }).join('　'));
  return L.join('\n');
}
function copySummary(btn) {
  var text = summaryText();
  function fallback() {
    var ta = $('#copy-fallback'); ta.hidden = false; ta.value = text; ta.focus(); ta.select();
    btn.textContent = '已選取文字，請按 Ctrl+C 複製';
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        btn.textContent = '已複製';
        setTimeout(function () { btn.textContent = '複製結果摘要'; }, 2000);
      }, fallback);
    } else fallback();
  } catch (e) { fallback(); }
}
function downloadReport(btn) {
  use('downloads').then(function (dl) {
    if (!dl) { btn.hidden = true; return; }
    var css = $('#app-css').textContent;
    var node = $('#report').cloneNode(true);
    Array.prototype.forEach.call(node.querySelectorAll('.no-export'), function (n) { n.remove(); });
    var aiSec = node.querySelector('#sec-ai');
    if (aiSec) {
      if (!state.letter) aiSec.remove();
      else { aiSec.hidden = false; aiSec.removeAttribute('hidden'); Array.prototype.forEach.call(aiSec.querySelectorAll('.ai-ctl,.ai-intro,#ai-note'), function (n) { n.remove(); }); }
    }
    var html = '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天賦羅盤報告 ' + fmtDate(state.doneAt) + '</title><link rel="stylesheet" href="' + FONT_URL + '"><style>' + css + '</style></head><body><div class="app">' + node.outerHTML + '</div></body></html>';
    return dl.save({ filename: '天賦羅盤報告-' + ymd(state.doneAt) + '.html', data: html }).then(function () {
      btn.textContent = '已下載';
      setTimeout(function () { btn.textContent = '下載報告'; }, 2500);
    });
  }).catch(function (e) {

    btn.textContent = '下載失敗，請再試一次';
  });
}
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function md(text) {
  function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  var html = '', list = null;
  function close() { if (list) { html += '</' + list + '>'; list = null; } }
  String(text).split('\n').forEach(function (raw) {
    var l = raw.trim(), m;
    if (!l) { close(); return; }
    if ((m = l.match(/^#{1,4}\s+(.*)$/))) { close(); html += '<h4>' + inline(m[1]) + '</h4>'; }
    else if ((m = l.match(/^[-*•]\s+(.*)$/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul'; } html += '<li>' + inline(m[1]) + '</li>'; }
    else if ((m = l.match(/^\d+[.)、]\s*(.*)$/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol'; } html += '<li>' + inline(m[1]) + '</li>'; }
    else { close(); html += '<p>' + inline(l) + '</p>'; }
  });
  close();
  return html;
}
function buildPrompt() {
  var R = RES || compute(), L = [];
  var cons = consistency(R.order[0], R.order[1]), diff = differentiation(R.ri);
  L.push('你是一位溫暖、直接、講證據的職涯顧問。請根據下面的測驗結果，用繁體中文（台灣用語）寫一封解讀信給受測者。');
  L.push('');
  L.push('寫作規則：');
  L.push('- 只使用下面提供的資料，不要編造受測者沒做過的經歷、數字或證照。');
  L.push('- 不要空泛稱讚（例如「你很棒」）。每個判斷都要說出是根據哪一項結果或哪一件事。');
  L.push('- 興趣和個性是自評，不等於能力。結果彼此矛盾時，提出可能的解釋，不要硬下結論。');
  L.push('- 用「你」稱呼。不要用表情符號。');
  L.push('- 長度約 700 字，使用以下四個 Markdown 小標題（以 ## 開頭）：');
  L.push('## 你是怎樣的人');
  L.push('## 結果之間的呼應與矛盾');
  L.push('## 最值得投入的方向');
  L.push('## 接下來 30 天');
  L.push('- 「接下來 30 天」列出 3 件具體、馬上可以做的事。');
  L.push('');
  L.push('【測驗結果】');
  L.push('類型名稱（由天賦前兩名組成）：' + archeOf(R));
  L.push('Holland 興趣代碼：' + R.code + '（0–100 分：' + HEX.map(function (x) { return x + ' ' + RIASEC[x].name + ' ' + R.ri[x]; }).join('、') + '）');
  L.push('前兩碼一致性：' + cons.label + '；興趣分化程度：' + diff.label);
  L.push('五大人格（1–5 分）：' + B5KEYS.map(function (k) { return B5INFO[k].name + ' ' + R.b5[k].toFixed(1) + '（' + BAND_LABEL[band(R.b5[k])] + '）'; }).join('、'));
  L.push('天賦自評排序（1–5 分）：' + R.tRank.map(function (k) { return tn(k) + ' ' + R.t[k].toFixed(1); }).join('、'));
  L.push('工作價值觀排序：' + R.vals.map(function (k) { return VALUES[k].name; }).join(' > '));
  L.push('系統配對的前六個方向：' + R.careers.slice(0, 6).map(function (c) { return c.name + ' ' + c.score + '%'; }).join('、'));
  if (state.observe) {
    L.push('');
    L.push('【Claude 在協助他做專案時觀察到的事例（真實發生，可以引用）】');
    L.push(BACKGROUND);
    T_ORDER.forEach(function (k) { L.push('- ' + tn(k) + '：' + TALENTS[k].ev); });
  }
  return L.join('\n');
}
var aiCtl = null;
var AI_ERR = { rate_limited: '目前使用太頻繁，請稍後再試。', session_expired: '請重新登入 Claude 後再試。', refused: '這次沒辦法產生解讀信，可以稍後再試。', empty_completion: '這次沒有產生內容，請再試一次。', prompt_too_large: '資料太長了，請重新整理頁面後再試。' };
function runLetter() {
  use('sample').then(function (sample) {
    var out = $('#ai-out'), note = $('#ai-note'), go = $('#ai-go'), stop = $('#ai-stop');
    if (!sample || !out) return;
    aiCtl = new AbortController();
    go.disabled = true; stop.hidden = false; note.textContent = '';
    out.innerHTML = '<p class="thinking">Claude 正在思考，大約需要 30–60 秒…</p>';
    var opts = { signal: aiCtl.signal, modelTier: 'default', onText: function (u) { out.innerHTML = md(u.text); } };
    if (state.letter) opts.cache = false;
    sample(buildPrompt(), opts).then(function (res) {
      out.innerHTML = md(res.text); state.letter = res.text; persist();
      if (res.truncated) note.textContent = '解讀信寫到一半被截斷了，可以再試一次。';
      saveLetter(res.text);
    }, function (e) {
      var code = e && e.code;
      out.innerHTML = (e && e.text) ? md(e.text) : (state.letter ? md(state.letter) : '');
      if (code === 'cancelled') return;
      if (['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].indexOf(code) >= 0) {
        var ctl = $('.ai-ctl'); if (ctl) ctl.hidden = true;
        note.textContent = '這個畫面無法使用 Claude 解讀，其他結果不受影響。';
        return;
      }
      note.textContent = AI_ERR[code] || '連線中斷了，請再試一次。';
    }).then(function () {
      go.disabled = false; go.textContent = state.letter ? '重寫一封' : '寫解讀信'; stop.hidden = true;
    });
  });
}

/* ================= events ================= */
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.val) { answer(+b.dataset.val); return; }
  if (b.dataset.v) { toggleValue(b.dataset.v); return; }
  switch (b.dataset.act) {
    case 'home': state.screen = 'intro'; persist(); render(); break;
    case 'begin': state.screen = 'quiz'; state.idx = 0; persist(); render(); break;
    case 'resume': state.screen = 'quiz'; persist(); render(); break;
    case 'next': next(); break;
    case 'back': back(); break;
    case 'restart': restart(b); break;
    case 'show-results': state.screen = 'results'; persist(); render(); break;
    case 'vreset': state.values = []; persist(); render(); break;
    case 'finish': finish(); break;
    case 'save': saveResult(); break;
    case 'copy': copySummary(b); break;
    case 'download': downloadReport(b); break;
    case 'ai-go': runLetter(); break;
    case 'ai-stop': if (aiCtl) aiCtl.abort(); break;
  }
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'observe') { state.observe = e.target.checked; persist(); }
});
document.addEventListener('keydown', function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey || state.screen !== 'quiz') return;
  var tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  var st = STEPS[state.idx];
  if (st.type === 'q' && /^[1-5]$/.test(e.key)) { e.preventDefault(); answer(+e.key); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); back(); }
  else if (e.key === 'ArrowRight' && (st.type === 'section' || (st.type === 'q' && state.ans[st.id]))) { e.preventDefault(); next(); }
});

/* ================= boot ================= */
loadLocal();
if (window.__TC_DEMO__) {
  var seed = 7;
  var rnd = function () { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  var base = { R: 2, I: 2.6, A: 3.8, S: 3.4, E: 4, C: 2.4, insight: 4.4, people: 4.1, ideate: 4, maker: 4.2, taste: 4.3, orchestrate: 3.9, influence: 3.6, analysis: 3.4, adapt: 4.5, order: 2.6 };
  ALL_Q.forEach(function (q) { var b = base[q.key] || 3; state.ans[q.id] = Math.max(1, Math.min(5, Math.round(b + (rnd() - 0.5) * 1.6))); });
  state.values = ['ach', 'ind', 'rel', 'rec', 'con', 'sup'];
  state.doneAt = new Date().toISOString(); state.screen = 'results';
}
render();
var hot = window.claude && window.claude.hot;
if (hot) {
  try { if (typeof hot.snapshot === 'function') hot.snapshot(function () { return { state: state }; }); } catch (e) { /* ignore */ }
  var start = function (data) { if (data && data.state) { state = sanitize(data.state); render(); } };
  try { if (typeof hot.ready === 'function') hot.ready(start); else start(hot.data || {}); } catch (e) { /* ignore */ }
}
})();
